#spring.application.name=assigame

# Charge un fichier .env local s'il existe (ignoré par Git). En production, ces valeurs
# viennent des variables d'environnement de la plateforme de déploiement.
spring.config.import=optional:file:.env[.properties]

# URL de connexion à la base de données PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
# Identifiants de connexion
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
app.secret-key=${APP_SECRET_KEY}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Configuration de la taille maximale des fichiers (ex: 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
